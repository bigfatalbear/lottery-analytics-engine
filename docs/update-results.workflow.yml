# NOTA: copia de referencia do workflow.
# O push inicial nao pode incluir .github/workflows/update-results.yml porque o token OAuth
# usado nao possui o escopo 'workflow'. Apos executar 'gh auth refresh -s workflow', mova este
# arquivo para .github/workflows/update-results.yml e faca o push.

name: Update lottery datasets

on:
  schedule:
    # Todos os dias, 06:15 UTC (03:15 America/Sao_Paulo)
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: 'Modalidade a atualizar (all, lotofacil, megasena)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - lotofacil
          - megasena
      dry_run:
        description: 'Executar sem gravar arquivos'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-datasets
  cancel-in-progress: false

jobs:
  update:
    name: Coletar, validar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar, normalizar e mesclar resultados
        env:
          GAME: ${{ inputs.game || 'all' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          ARGS="--game=${GAME}"
          if [ "${DRY_RUN}" = "true" ]; then ARGS="${ARGS} --dry-run"; fi
          node scripts/update-dataset.mjs ${ARGS}

      - name: Validar datasets resultantes
        run: node scripts/validate-dataset.mjs

      - name: Executar testes
        run: node tests/run.js

      - name: Publicar relatorio da execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-report
          path: data/report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit apenas se houver alteracao real
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name 'lottery-analytics-bot'
          git config user.email 'lottery-analytics-bot@users.noreply.github.com'
          if git diff --quiet -- data/*.json; then
            echo 'Nenhuma alteracao nos datasets.'
            exit 0
          fi
          git add data/lotofacil.json data/megasena.json
          git commit -m "chore(data): atualiza resultados historicos"
          git push
